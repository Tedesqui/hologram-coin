    // --- INICIALIZADOR DA WEBCAM COMBINADO ---
    async function initWebcam() {
      const videoBg = document.getElementById('webcam-background');
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" },
            audio: false
          });
          videoBg.srcObject = stream;
        } catch (err) {
          console.error("Erro ao abrir a webcam:", err);
        }
      }
    }

    // --- FUNÇÃO DO MODAL CUSTOMIZADO ---
    function showCustomModal(message, showInput, btnCancelText, btnOkText) {
      return new Promise((resolve) => {
        const overlay = document.getElementById('customModalOverlay');
        const msgEl = document.getElementById('customModalMessage');
        const inputEl = document.getElementById('customModalInput');
        const btnCancel = document.getElementById('customModalCancel');
        const btnOk = document.getElementById('customModalConfirm');

        msgEl.innerText = message;
        inputEl.value = '';

        if (showInput) {
          inputEl.classList.remove('hidden');
          btnCancel.classList.remove('hidden');
          setTimeout(() => inputEl.focus(), 100);
        } else {
          inputEl.classList.add('hidden');
          btnCancel.classList.add('hidden');
        }

        btnCancel.innerText = btnCancelText || "Cancelar";
        btnOk.innerText = btnOkText || "OK";

        overlay.classList.remove('hidden');

        const closeModal = (result) => {
          overlay.classList.add('hidden');
          btnOk.onclick = null;
          btnCancel.onclick = null;
          resolve(result);
        };

        btnOk.onclick = () => { closeModal(showInput ? inputEl.value : true); };
        btnCancel.onclick = () => { closeModal(null); };
      });
    }

    function renderRichTextToCanvas(text) {
      const canvas = document.getElementById('textCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'white';
      
      const lines = text.split('\n');
      
      lines.forEach((line, index) => {
        const y = canvas.height / 2 + (index - (lines.length - 1) / 2) * 85;
        
        if (line.includes('$')) {
          const parts = line.split('$');
          const normalFont = 'bold 64px sans-serif'; 
          const boldFont = 'black 105px sans-serif';
          
          ctx.font = normalFont;
          const widthPart1 = ctx.measureText(parts[0]).width;
          
          ctx.font = boldFont;
          const widthDollar = ctx.measureText('$').width;
          
          ctx.font = normalFont;
          const widthPart2 = ctx.measureText(parts[1]).width;
          
          const totalWidth = widthPart1 + widthDollar + widthPart2;
          let startX = canvas.width / 2 - totalWidth / 2;
          
          ctx.font = normalFont;
          ctx.textAlign = 'left';
          ctx.fillStyle = 'white';
          ctx.fillText(parts[0], startX, y);
          startX += widthPart1;
          
          ctx.font = boldFont;
          ctx.fillStyle = 'white'; 
          ctx.fillText('$', startX, y);
          startX += widthDollar;
          
          ctx.font = normalFont;
          ctx.fillStyle = 'white';
          ctx.fillText(parts[1], startX, y);
        } else {
          ctx.font = 'bold 64px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(line, canvas.width / 2, y);
        }
      });
      
      const plane = document.getElementById('finalTextPlane');
      if (plane && plane.getObject3D('mesh')) {
        const material = plane.getObject3D('mesh').material;
        if (material && material.map) {
          material.map.needsUpdate = true;
        }
      }
    }

    function configureLanguageAndTexts() {
      const userLang = (navigator.language || navigator.userLanguage).substring(0, 2);
      const activeLang = translations[userLang] ? userLang : 'en';

      if (video) {
        video.src = translations[activeLang].videoUrl;
        video.load(); 
      }

      if (initialMessage) {
        initialMessage.innerText = translations[activeLang].initial;
      }

      const iosPrompt = document.getElementById('iosInstallPrompt');
      if (iosPrompt) {
        iosPrompt.innerHTML = `
          <button class="close-btn" onclick="document.getElementById('iosInstallPrompt').style.display='none'">X</button>
          ${translations[activeLang].ios}
        `;
      }

      renderRichTextToCanvas(translations[activeLang].finalText);
    }

    let promptShown = false;
    function showOneSignalPrompt() {
      if (!promptShown) {
        window.OneSignalDeferred.push(async function(OneSignal) {
          try {
            await OneSignal.Notifications.requestPermission();
            console.log("Prompt nativo solicitado no mobile.");
          } catch (error) {
            console.error("Erro ao pedir permissão nativa:", error);
          }
        });
        promptShown = true;
      }
    }

    playPauseButton.addEventListener('click', () => {
      showOneSignalPrompt();

      if (initialMessage) {
        initialMessage.style.display = 'none';
      }

      if (video.paused) {
        if (imageEntity.getAttribute('visible') === 'true' || imageEntity.getAttribute('visible') === true) {
          imageEntity.setAttribute('visible', 'false');
          videoEntity.setAttribute('visible', 'true');
          video.currentTime = 0; 
          skipReplayButton.innerHTML = '<span class="icon">⏭︎</span> <span class="text">Skip</span>';
        }
        video.muted = false;
        video.play();
        playPauseButton.innerHTML = '<span class="icon">⏸︎</span> <span class="text">Pause</span>';
        playPauseButton.classList.replace('is-paused', 'is-playing');
      } else {
        video.pause();
        playPauseButton.innerHTML = '<span class="icon">▶︎</span> <span class="text">Play</span>';
        playPauseButton.classList.replace('is-playing', 'is-paused');
      }
    });

    skipReplayButton.addEventListener('click', () => {
      showOneSignalPrompt();

      const isVideoEndedOrSkipped = video.ended || imageEntity.getAttribute('visible') === 'true' || imageEntity.getAttribute('visible') === true;

      if (isVideoEndedOrSkipped) {
        videoEntity.setAttribute('visible', 'true');
        imageEntity.setAttribute('visible', 'false');
        video.currentTime = 0;
        video.muted = false;
        video.play();

        playPauseButton.innerHTML = '<span class="icon">⏸︎</span> <span class="text">Pause</span>';
        playPauseButton.classList.replace('is-paused', 'is-playing');
        skipReplayButton.innerHTML = '<span class="icon">⏭︎</span> <span class="text">Skip</span>';
      } else {
        video.pause();
        videoEntity.setAttribute('visible', 'false');
        imageEntity.setAttribute('visible', 'true');

        playPauseButton.innerHTML = '<span class="icon">▶︎</span> <span class="text">Play</span>';
        playPauseButton.classList.replace('is-playing', 'is-paused');
        skipReplayButton.innerHTML = '<span class="icon">↺</span> <span class="text">Replay</span>';
      }
    });
    
    video.addEventListener('ended', function() {
      videoEntity.setAttribute('visible', 'false');
      imageEntity.setAttribute('visible', 'true');
      
      playPauseButton.innerHTML = '<span class="icon">▶︎</span> <span class="text">Play</span>';
      playPauseButton.classList.replace('is-playing', 'is-paused');
      
      skipReplayButton.innerHTML = '<span class="icon">↺</span> <span class="text">Replay</span>';
    });

    function checkIOSInstallation() {
      const isIos = () => {
        const userAgent = window.navigator.userAgent.toLowerCase();
        return /iphone|ipad|ipod/.test(userAgent);
      };

      const isInStandaloneMode = () => ('standalone' in window.navigator) && (window.navigator.standalone);

      if (isIos() && !isInStandaloneMode()) {
        const prompt = document.getElementById('iosInstallPrompt');
        if (prompt) {
          prompt.style.display = 'block';
        }
      }
    }

    // --- LOGÍCA WEB3 TOTALMENTE COMPILADA E COMPATÍVEL ---
    const CONTRATO_VENDA_ADDRESS = "0x2228BB60df11da3EcD25EC6b12D1E91e78d46C68"; 
    
    const CONTRATO_VENDA_ABI = [
      "function buyTokens() public payable"
    ];

    buyTokenBtn.addEventListener('click', async () => {
      const userLang = (navigator.language || navigator.userLanguage).substring(0, 2);
      const activeLang = translations[userLang] ? userLang : 'en';
      const langText = translations[activeLang];

      if (typeof window.ethereum === 'undefined') {
        await showCustomModal(langText.web3Missing, false, "", langText.btnOk);
        return;
      }

      try {
        buyTokenBtn.innerHTML = "⏳";
        buyTokenBtn.style.pointerEvents = "none";

        const provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        const signer = provider.getSigner();

        const targetNetworkId = '0x89'; 
        const { chainId } = await provider.getNetwork();
        
        if (chainId !== 137) {
          try {
            await window.ethereum.request({
              method: 'wallet_switchEthereumChain',
              params: [{ chainId: targetNetworkId }],
            });
          } catch (switchError) {
            if (switchError.code === 4902) {
              await window.ethereum.request({
                method: 'wallet_addEthereumChain',
                params: [{
                  chainId: targetNetworkId,
                  chainName: 'Polygon Mainnet',
                  rpcUrls: ['https://polygon-rpc.com/'],
                  nativeCurrency: { name: 'POL', symbol: 'POL', decimals: 18 },
                  blockExplorerUrls: ['https://polygonscan.com/']
                }],
              });
            } else {
              throw switchError;
            }
          }
        }

        const polAmount = await showCustomModal(langText.buyPrompt, true, langText.btnCancel, langText.btnOk);
        
        if (!polAmount || isNaN(polAmount) || parseFloat(polAmount) <= 0) {
          throw new Error(langText.invalidAmount);
        }

        const contract = new ethers.Contract(CONTRATO_VENDA_ADDRESS, CONTRATO_VENDA_ABI, signer);
        const valorEmWei = ethers.utils.parseEther(polAmount);

        const tx = await contract.buyTokens({ value: valorEmWei });
        
        showCustomModal(langText.txSent, false, "", langText.btnOk);
        
        await tx.wait();
        showCustomModal(langText.txSuccess, false, "", langText.btnOk);

      } catch (error) {
        console.error("Erro detectado na transacao:", error);
        
        const errorMessage = error.toString() || "";

        if (errorMessage.includes("Nao ha tokens suficientes")) {
          showCustomModal(langText.insufficientTokens, false, "", langText.btnOk);
        } else if (errorMessage.includes("Valor enviado e muito baixo")) {
          showCustomModal(langText.amountTooLow, false, "", langText.btnOk);
        } else if (errorMessage.includes("Apenas o dono")) {
          showCustomModal(langText.onlyOwner, false, "", langText.btnOk);
        } else if (errorMessage.includes("Preco nao configurado")) {
          showCustomModal(langText.priceNotSet, false, "", langText.btnOk);
        } else if (errorMessage.includes("Envie POL para comprar")) {
          showCustomModal(langText.sendPol, false, "", langText.btnOk);
        } else if (errorMessage.includes("Falha ao retirar tokens")) {
          showCustomModal(langText.failWithdraw, false, "", langText.btnOk);
        } else if (error.message === translations[userLang]?.invalidAmount || error.message === translations['en'].invalidAmount) {
          // Operação abortada de forma limpa pelo usuário
        } else {
          showCustomModal(langText.txFailed, false, "", langText.btnOk);
        }
      } finally {
        buyTokenBtn.innerHTML = "$";
        buyTokenBtn.style.pointerEvents = "auto";
      }
    });

    window.addEventListener('load', () => {
      configureLanguageAndTexts();
      checkIOSInstallation();
      initWebcam(); 
    });
