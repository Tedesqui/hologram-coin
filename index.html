    body { font-family: sans-serif; margin: 0; }

    /* Configuração geral dos botões de controle */
    .control-btn { background-color: rgba(0, 0, 0, 0.42); border: none; border-radius: 5px; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 4px; color: white; height: 44px; }

    .control-btn:active { transform: scale(0.95); } /* Efeito sutil de clique */

    /* Botão Play/Pause fixado na Esquerda */
    #playPauseButton { position: fixed; top: 20px; left: 20px; z-index: 999; }
    #playPauseButton.is-playing { padding: 0 20px; }
    #playPauseButton.is-paused { padding: 0 10px; }
    #playPauseButton .icon { color: #28a745; }
    #playPauseButton.is-playing .icon { font-size: 24px; }
    #playPauseButton.is-paused .icon { font-size: 38px; position: relative; bottom: 2px; left: 2px; }

    /* Botão Skip/Replay fixado na Direita */

    #skipReplayButton .icon { font-size: 20px; color: #ffc107; }

    #central-button-container { position: fixed; bottom: 100px; left: 50%; transform: translateX(calc(-50% - 8px)); z-index: 999; }

    .prosperity-button:hover { transform: scale(1.1); }
    
    #footerSocial { position: fixed; bottom: 0; left: 0; right: 0; padding: 20px 0; display: flex; justify-content: center; align-items: center; gap: 40px; z-index: 998; background-color: rgba(0, 0, 0, 0.1); box-shadow: 0 0 19.5px rgba(0, 0, 0, 0.47); }
    #footerSocial a { display: flex; align-items: center; justify-content: center; width: 34.56px; height: 34.56px; text-decoration: none; }
    #footerSocial svg { width: 100%; height: 100%; transition: transform 0.3s ease; }
    #footerSocial a:hover svg { transform: scale(1.1); }
    
    /* Ajuste do Instagram 5 pixels para a direita */
    #footerSocial a.instagram { width: 41.47px; height: 41.47px; position: relative; left: 1px; }
    
    #footerSocial a.telegram, #footerSocial a.telegram svg { width: 51.84px; height: 51.84px; }
    #footerSocial .twitter svg { fill: #000000; } 
    #footerSocial .instagram svg { fill: #833AB4; }
    #footerSocial .telegram svg { fill: #0088cc; }

    /* Estilo do aviso exclusivo para iOS */
    #iosInstallPrompt {
      display: none; /* Escondido por padrão */
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(255, 255, 255, 0.95);
      color: #000;
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      z-index: 10000;
      width: 85%;
      max-width: 350px;
      text-align: center;
      font-size: 15px;
      font-weight: bold;
    }
    #iosInstallPrompt .share-icon {
      display: inline-block;
      width: 20px;
      height: 20px;
      vertical-align: middle;
      margin: 0 5px;
    }
    #iosInstallPrompt .close-btn {
      position: absolute;
      top: -10px;
      right: -10px;
      background: #ff3b30;
      color: white;
      border: none;
      border-radius: 50%;
      width: 25px;
      height: 25px;
      font-size: 14px;
      cursor: pointer;
      font-weight: bold;
    }

  <script>
    const video = document.querySelector('#Video_Asset_0');
    const playPauseButton = document.getElementById('playPauseButton');
    const skipReplayButton = document.getElementById('skipReplayButton');
    const videoEntity = document.querySelector('#video-inicial-entity');
    const imageEntity = document.querySelector('#imagem-final-entity');
    const initialMessage = document.getElementById('initialMessage');

    // --- DICIONÁRIO CONFIGURADO COM TEXTOS E CAMINHOS DE VÍDEO DIFERENTES ---
    const translations = {
      pt: {
        videoUrl: "new/hannah2.mp4", // Vídeo em português
        initial: "Aponte o celular para frente para assistir ao vídeo e clique em Play.",
        ios: `Para receber notificações de altíssima prioridade, toque em <svg class="share-icon" viewBox="0 0 50 50" fill="none" stroke="currentColor" stroke-width="4"><path d="M25 2v26M15 12l10-10 10 10M10 20v20h30V20"/></svg> e selecione <strong>"Adicionar à Tela de Início"</strong>.`,
        finalText: "COMPRE ELON MUSK DIRIGINDO UM BYD AGORA!!!\nCLIQUE NO BOTAO $ !!!"
      },
      en: {
        videoUrl: "new/hannah2_en.mp4", // Vídeo em inglês
        initial: "Point your phone forward to watch the video, then click Play.",
        ios: `To receive high-priority notifications, tap <svg class="share-icon" viewBox="0 0 50 50" fill="none" stroke="currentColor" stroke-width="4"><path d="M25 2v26M15 12l10-10 10 10M10 20v20h30V20"/></svg> and select <strong>"Add to Home Screen"</strong>.`,
        finalText: "BUY ELON MUSK DRIVING A BYD NOW!!!\nCLICK THE $ BUTTON!!!"
      },
      es: {
        videoUrl: "new/hannah2_es.mp4", // Vídeo em espanhol
        initial: "Apunta tu teléfono hacia adelante para ver el video, luego haz clic en Play.",
        ios: `Para recibir notificaciones de alta prioridad, toca en <svg class="share-icon" viewBox="0 0 50 50" fill="none" stroke="currentColor" stroke-width="4"><path d="M25 2v26M15 12l10-10 10 10M10 20v20h30V20"/></svg> y selecciona <strong>"Añadir a la pantalla de inicio"</strong>.`,
        finalText: "¡¡¡COMPRA A ELON MUSK CONDUCIENDO UN BYD AHORA!!!\n¡¡¡HAZ CLIC EN EL BOTON $ !!!"
      },
      fr: {
        videoUrl: "new/hannah2_fr.mp4", // Vídeo em francês
        initial: "Pointez votre téléphone vers l'avant pour regarder la vidéo, puis cliquez sur Play.",
        ios: `Pour recevoir des notifications de haute priorité, appuyez sur <svg class="share-icon" viewBox="0 0 50 50" fill="none" stroke="currentColor" stroke-width="4"><path d="M25 2v26M15 12l10-10 10 10M10 20v20h30V20"/></svg> et sélectionnez <strong>"Sur l'écran d'accueil"</strong>.`,
        finalText: "ACHETEZ ELON MUSK CONDUISANT UNE BYD MAINTENANT !!!\nCLIQUEZ SUR LE BOUTON $ !!!"
      },
      de: {
        videoUrl: "new/hannah2_de.mp4", // Vídeo em alemão
        initial: "Richten Sie Ihr Telefon nach vorne, um das Video anzusehen, und klicken Sie auf Play.",
        ios: `Um Benachrichtigungen mit hoher Priorität zu erhalten, tippen Sie auf <svg class="share-icon" viewBox="0 0 50 50" fill="none" stroke="currentColor" stroke-width="4"><path d="M25 2v26M15 12l10-10 10 10M10 20v20h30V20"/></svg> und wählen Sie <strong>"Zum Home-Bildschirm"</strong>.`,
        finalText: "KAUFEN SIE ELON MUSK BEIM FAHREN EINES BYD JETZT!!!\nKlicken Sie auf die $-Taste!!!"
      },
      ja: {
        videoUrl: "new/hannah2_ja.mp4", // Vídeo em japonês
        initial: "スマートフォンを前方に向けて動画を視聴し、[Play]をクリックしてください。",
        ios: `優先度の高い通知を受け取るには、<svg class="share-icon" viewBox="0 0 50 50" fill="none" stroke="currentColor" stroke-width="4"><path d="M25 2v26M15 12l10-10 10 10M10 20v20h30V20"/></svg>をタップして<strong>「ホーム画面に追加」</strong>を選択してください。`,
        finalText: "今すぐBYDを運転するイーロン・マスクを購入してください！！！\n$ ボタンをクリックしてください!!!"
      },
      ko: {
        videoUrl: "new/hannah2_ko.mp4", // Vídeo em coreano
        initial: "동영상을 시청하려면 휴대폰을 앞쪽으로 향하게 한 다음 재생(Play)을 클릭하세요.",
        ios: `높은 우선순위 알림을 받으려면 <svg class="share-icon" viewBox="0 0 50 50" fill="none" stroke="currentColor" stroke-width="4"><path d="M25 2v26M15 12l10-10 10 10M10 20v20h30V20"/></svg>을 누르고 <strong>'홈 화면에 추가'</strong>를 선택하세요.`,
        finalText: "지금 BYD를 운전하는 일론 머스크를 구매하세요!!!\n$ 버튼을 클릭하세요!!!"
      },
      zh: {
        videoUrl: "new/hannah2_zh.mp4", // Vídeo em chinês
        initial: "将手机向前对准以观看视频，然后点击播放（Play）。",
        ios: `要接收高优先级通知，请点击 <svg class="share-icon" viewBox="0 0 50 50" fill="none" stroke="currentColor" stroke-width="4"><path d="M25 2v26M15 12l10-10 10 10M10 20v20h30V20"/></svg> 并选择<strong>“添加到主屏幕”</strong>。`,
        finalText: "现在购买埃隆·马斯克驾驶BYD！！！\n点击 $ 按钮！！！"
      }
    };

    function configureLanguageAndTexts() {
      const userLang = (navigator.language || navigator.userLanguage).substring(0, 2);
      const activeLang = translations[userLang] ? userLang : 'en';

      // [AÇÃO DETECTADA] Injeta dinamicamente o link do vídeo correto baseado no idioma
      if (video) {
        video.src = translations[activeLang].videoUrl;
        video.load(); // Avisa o navegador para carregar as configurações do novo link
      }

      if (initialMessage) {
        initialMessage.innerText = translations[activeLang].initial;
      }

      const iosPrompt = document.getElementById('iosInstallPrompt');
      if (iosPrompt) {
        iosPrompt.innerHTML = `
          <button class="close-btn" onclick="document.getElementById('iosInstallPrompt').style.display='none'">X</button>
          ${translations[activeLang].ios}
        `;
      }

      const finalTextEl = document.getElementById('finalText');
      if (finalTextEl) {
        finalTextEl.setAttribute('value', translations[activeLang].finalText);
      }
    }

    let promptShown = false;
    function showOneSignalPrompt() {
      if (!promptShown) {
        window.OneSignalDeferred.push(async function(OneSignal) {
          try {
            await OneSignal.Notifications.requestPermission();
            console.log("Prompt nativo solicitado no mobile.");
          } catch (error) {
            console.error("Erro ao pedir permissão nativa:", error);
          }
        });
        promptShown = true;
      }
    }

    // Lógica do botão Play/Pause
    playPauseButton.addEventListener('click', () => {
      showOneSignalPrompt();

      if (initialMessage) {
        initialMessage.style.display = 'none';
      }

      if (video.paused) {
        if (imageEntity.getAttribute('visible') === 'true' || imageEntity.getAttribute('visible') === true) {
          imageEntity.setAttribute('visible', 'false');
          videoEntity.setAttribute('visible', 'true');
          video.currentTime = 0; 
          skipReplayButton.innerHTML = '<span class="icon">⏭︎</span> <span class="text">Skip</span>';
        }
        video.muted = false;
        video.play();
        playPauseButton.innerHTML = '<span class="icon">⏸︎</span> <span class="text">Pause</span>';
        playPauseButton.classList.replace('is-paused', 'is-playing');
      } else {
        video.pause();
        playPauseButton.innerHTML = '<span class="icon">▶︎</span> <span class="text">Play</span>';
        playPauseButton.classList.replace('is-playing', 'is-paused');
      }
    });

    // Lógica do botão Skip/Replay
    skipReplayButton.addEventListener('click', () => {
      showOneSignalPrompt();

      const isVideoEndedOrSkipped = video.ended || imageEntity.getAttribute('visible') === 'true' || imageEntity.getAttribute('visible') === true;

      if (isVideoEndedOrSkipped) {
        videoEntity.setAttribute('visible', 'true');
        imageEntity.setAttribute('visible', 'false');
        video.currentTime = 0;
        video.muted = false;
        video.play();

        playPauseButton.innerHTML = '<span class="icon">⏸︎</span> <span class="text">Pause</span>';
        playPauseButton.classList.replace('is-paused', 'is-playing');
        skipReplayButton.innerHTML = '<span class="icon">⏭︎</span> <span class="text">Skip</span>';
      } else {
        video.pause();
        videoEntity.setAttribute('visible', 'false');
        imageEntity.setAttribute('visible', 'true');

        playPauseButton.innerHTML = '<span class="icon">▶︎</span> <span class="text">Play</span>';
        playPauseButton.classList.replace('is-playing', 'is-paused');
        skipReplayButton.innerHTML = '<span class="icon">↺</span> <span class="text">Replay</span>';
      }
    });
    
    video.addEventListener('ended', function() {
      videoEntity.setAttribute('visible', 'false');
      imageEntity.setAttribute('visible', 'true');
      
      playPauseButton.innerHTML = '<span class="icon">▶︎</span> <span class="text">Play</span>';
      playPauseButton.classList.replace('is-playing', 'is-paused');
      
      skipReplayButton.innerHTML = '<span class="icon">↺</span> <span class="text">Replay</span>';
    });

    // Função para detectar iPhone/iPad e se já está instalado
    function checkIOSInstallation() {
      const isIos = () => {
        const userAgent = window.navigator.userAgent.toLowerCase();
        return /iphone|ipad|ipod/.test(userAgent);
      };

      const isInStandaloneMode = () => ('standalone' in window.navigator) && (window.navigator.standalone);

      if (isIos() && !isInStandaloneMode()) {
        const prompt = document.getElementById('iosInstallPrompt');
        if (prompt) {
          prompt.style.display = 'block';
        }
      }
    }

    // Executa as traduções, define o vídeo correto e faz a checagem do iOS
    window.addEventListener('load', () => {
      configureLanguageAndTexts();
      checkIOSInstallation();
    });
  </script>
</body>
